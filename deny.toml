# cargo deny check: licenses must be GPL-3.0 compatible; no yanked or vulnerable crates.
[graph]
all-features = false

[advisories]
yanked = "deny"
# Transitive crates (Slint, btleplug) we cannot swap are reported, not blocking.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
