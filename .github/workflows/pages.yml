# Publishes site/ to GitHub Pages. Screenshots and fonts are copied in from the UI crate so the
# site always shows the current snapshots. Enable Pages with "GitHub Actions" as the source.
name: pages
on:
  push:
    branches: [main]
    paths: [site/**, crates/ui/tests/snapshots/**, packaging/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p site/img site/fonts
          s=crates/ui/tests/snapshots
          cp $s/snapshots__watch.snap.png site/img/watch.png
          cp $s/snapshots__panel_today.snap.png site/img/panel.png
          cp $s/snapshots__desktop_history_month.snap.png site/img/history.png
          cp packaging/fitvr.png site/img/icon.png
          cp packaging/social-preview.png site/img/social.png
          cp crates/ui/ui/fonts/*.ttf crates/ui/ui/fonts/*.txt site/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
