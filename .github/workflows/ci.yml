name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Oldest Ubuntu runners that work: the binary must run on SteamOS's glibc.
        include:
          - { os: windows-latest, artifact: sweatxr-windows-x64, bin: sweatxr.exe }
          - { os: ubuntu-22.04, artifact: sweatxr-linux-x64, bin: sweatxr }
          - { os: ubuntu-22.04-arm, artifact: sweatxr-linux-arm64, bin: sweatxr }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-dev libfontconfig1-dev libxml2-utils
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: TCX validates against TrainingCenterDatabase v2
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o tcx.xsd https://www8.garmin.com/xmlschemas/TrainingCenterDatabasev2.xsd
          cargo run -q -p sweatxr-core --example tcx_sample > sample.tcx
          xmllint --noout --schema tcx.xsd sample.tcx
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: runner.os == 'Linux' && runner.arch == 'X64'
      - run: cargo build --release -p sweatxr
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/sweatxr
          cp target/release/${{ matrix.bin }} LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md dist/sweatxr/
          if [ "$RUNNER_OS" = Linux ]; then cp scripts/install.sh scripts/uninstall.sh dist/sweatxr/
          else cp "scripts/Uninstall SweatXR.cmd" dist/sweatxr/; fi
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then f=${{ matrix.artifact }}.zip; 7z a -tzip "$f" sweatxr > /dev/null
          else f=${{ matrix.artifact }}.tar.gz; tar czf "$f" sweatxr; fi
          sha256sum "$f" > "$f.sha256"
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          arch=$(uname -m)
          curl -sSfL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-$arch.AppImage"
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp target/release/sweatxr AppDir/usr/bin/
          cp packaging/sweatxr.desktop packaging/sweatxr.png AppDir/
          ln -s usr/bin/sweatxr AppDir/AppRun
          # Runners have no FUSE; extract-and-run avoids it.
          ARCH=$arch ./appimagetool --appimage-extract-and-run AppDir "dist/${{ matrix.artifact }}.AppImage"
          cd dist && sha256sum "${{ matrix.artifact }}.AppImage" > "${{ matrix.artifact }}.AppImage.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  # Pushing a tag like v1.0.0 builds every target, then opens a draft release with the archives,
  # their SHA-256 files and the matching CHANGELOG section. Publish the draft by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          files: dist/*
